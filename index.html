<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://script.google.com" crossorigin />
<link rel="dns-prefetch" href="https://script.google.com" />
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
<link rel="dns-prefetch" href="https://script.googleusercontent.com" />
<link rel="manifest" href="manifest.json" />

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<title>발주 체크리스트</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-blur: rgba(255, 255, 255, 0.72);
    --paper: #f2f4f6;
    --ink: #201d1a;
    --ink-sub: #7c766d;
    --line: #e1e5e9;
    --accent: #3182f6;
    --accent-soft: #3182f61a;
    --done: #b7b096;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --bg-blur: rgba(23, 24, 26, 0.72);
      --paper: #211f1c;
      --ink: #ece7de;
      --ink-sub: #8f887c;
      --line: #37342e;
      --accent: #5b9bf8;
      --accent-soft: #5b9bf826;
      --done: #5b5647;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a;
    --bg-blur: rgba(23, 24, 26, 0.72);
    --paper: #211f1c;
    --ink: #ece7de;
    --ink-sub: #8f887c;
    --line: #37342e;
    --accent: #5b9bf8;
    --accent-soft: #5b9bf826;
    --done: #5b5647;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --bg-blur: rgba(255, 255, 255, 0.72);
    --paper: #f2f4f6;
    --ink: #201d1a;
    --ink-sub: #7c766d;
    --line: #e1e5e9;
    --accent: #3182f6;
    --accent-soft: #3182f61a;
    --done: #b7b096;
  }

  * { box-sizing: border-box; }

  html {
    touch-action: manipulation;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 28px 16px 40px;
    touch-action: manipulation;
  }

  .sheet {
    max-width: 640px;
    margin: 0 auto;
  }

  /* ---------- Header (plain, fixed) ---------- */
  .top-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(to bottom, var(--bg) 55%, transparent 100%);
    padding: 24px 4px 28px;
    margin-bottom: -12px;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    height: 34px;
    margin-bottom: 14px;
  }
  .eyebrow[hidden] {
    display: none;
  }
  .eyebrow-btn {
    border: none;
    background: none;
    padding: 0;
    margin: 0;
    font-family: inherit;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--ink);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-track {
    flex: 1;
    height: 6px;
    border-radius: 999px;
    background: var(--accent-soft);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .progress-count {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
  }

  /* ---------- Section (ticket block) ---------- */
  .section {
    background: var(--paper);
    border-radius: 16px;
    margin-bottom: 14px;
    padding: 8px 22px 6px;
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .section > .item:last-child {
    border-bottom: none;
  }

  .item-body {
    flex: 1;
    min-width: 0;
  }
  .item-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .item-label {
    min-width: 0;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    overflow-wrap: break-word;
    transition: color 0.2s ease;
  }
  .qty-wrap {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 1px;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
  }
  .qty-wrap .paren {
    color: var(--ink);
  }
  .qty-wrap .qty-target {
    font-variant-numeric: tabular-nums;
  }
  .qty-input {
    width: 32px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--ink);
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 2px 0 3px;
    margin: 0 2px;
    -moz-appearance: textfield;
    transition: color 0.2s ease;
  }
  .qty-input::placeholder {
    color: var(--line);
    font-weight: 600;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .qty-input:focus {
    outline: none;
  }
  .item-note {
    font-size: 12.5px;
    color: var(--ink-sub);
    margin-top: 3px;
    line-height: 1.5;
    display: flex;
    gap: 5px;
  }
  .item-note::before {
    content: '·';
    color: var(--accent);
    font-weight: 800;
  }

  .item.filled .item-label {
    color: var(--ink);
  }
  .item.filled .qty-input {
    color: var(--accent);
  }

  .seg-pill {
    position: relative;
    flex: 0 0 auto;
    display: flex;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    width: 138px;
  }
  .seg-indicator {
    position: absolute;
    top: 3px;
    left: 3px;
    height: calc(100% - 6px);
    width: 0;
    background: var(--accent);
    border-radius: 999px;
    opacity: 0;
    transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.2s ease;
    z-index: 0;
  }
  .seg-pill.picked .seg-indicator {
    opacity: 1;
  }
  .seg-btn {
    position: relative;
    z-index: 1;
    flex: 1;
    height: 30px;
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
    border-radius: 999px;
  }

  .bottom-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
  }
  .page-btn {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 999px;
    border: none;
    background: var(--paper);
    color: var(--ink);
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, background 0.2s ease;
  }
  .page-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .page-dots {
    display: flex;
    align-items: center;
  }
  .page-dot {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .page-dot::before {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--line);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .page-dot.active::before {
    background: var(--accent);
    transform: scale(1.35);
  }
  .save-btn {
    display: none;
    width: 100%;
    max-width: 220px;
    height: 40px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    margin: 4px auto 0;
  }
  .save-btn.visible {
    display: block;
  }

  .admin-inline-login {
    position: relative;
    height: 34px;
    margin-bottom: 14px;
  }
  .admin-pin-row {
    width: 184px;
    height: 100%;
  }
  .admin-pass-input {
    width: 100%;
    height: 100%;
    text-align: center;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.2em;
    color: var(--ink);
    background: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 0;
    box-sizing: border-box;
  }
  .admin-pass-input:focus {
    outline: none;
  }
  .admin-error {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 6px;
    color: #e0483e;
    font-size: 12px;
    font-weight: 600;
  }
  .admin-btn {
    flex: 1;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .admin-view {
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 16px 60px;
  }
  .admin-view-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .admin-view-title {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-left: -12px;
  }
  .admin-view .admin-btn {
    flex: 0 0 auto;
    width: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .admin-date-select {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    background: var(--paper);
    border: none;
    border-radius: 10px;
    padding: 10px 28px 10px 12px;
    margin-bottom: 16px;
    box-sizing: border-box;
  }
  .admin-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .admin-tab {
    flex: 1;
    height: 36px;
    border: none;
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .admin-tab.active {
    background: var(--accent);
    color: #fff;
  }
  .admin-empty {
    padding: 28px 2px;
    text-align: center;
    color: var(--ink-sub);
    font-size: 14px;
  }
  .admin-loading {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 220px);
  }
  .admin-spinner {
    width: 26px;
    height: 26px;
    border-radius: 999px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    animation: admin-spin 0.7s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .admin-spinner {
      animation: none;
    }
  }
  @keyframes admin-spin {
    to {
      transform: rotate(360deg);
    }
  }
  .admin-page-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 20px 2px 6px;
  }
  .admin-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 2px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .admin-row .a-label {
    color: var(--ink);
    font-weight: 600;
  }
  .admin-row .a-value {
    flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--ink-sub);
  }
  .admin-row .a-value.a-empty {
    color: var(--line);
  }
  .admin-row .a-value.a-under {
    color: #e0483e;
  }
  .admin-row .a-value.a-equal {
    color: var(--accent);
  }
  .admin-row .a-value.a-over {
    color: var(--accent);
  }
</style>
</head>
<body>

  <div class="sheet" id="sheet">
    <div class="top-header">
      <div class="eyebrow" id="eyebrowWrap">
        <button type="button" class="eyebrow-btn" id="eyebrowBtn">MGC · 춘천온의파크점</button>
      </div>
      <div class="admin-inline-login" id="adminInlineLogin" hidden>
        <div class="admin-pin-row">
          <input
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
            id="adminPassInput"
            class="admin-pass-input"
            placeholder=""
          />
        </div>
        <div class="admin-error" id="adminError" hidden>PIN이 올바르지 않습니다</div>
      </div>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-count" id="progressCount">0 / 0</div>
      </div>
      <div class="bottom-nav" id="bottomNav">
        <button class="page-btn" id="prevBtn" aria-label="이전 페이지">‹</button>
        <div class="page-dots" id="pageDots"></div>
        <button class="page-btn" id="nextBtn" aria-label="다음 페이지">›</button>
      </div>
    </div>

    <div id="sections"></div>
    <button class="save-btn" id="saveBtn">저장</button>
  </div>

  <div class="admin-view" id="adminView" hidden>
    <div class="admin-view-header">
      <div class="admin-view-title">MGC · 춘천온의파크점</div>
      <button class="admin-btn" id="adminBackBtn" aria-label="체크리스트로">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
    <select class="admin-date-select" id="adminDateSelect"></select>
    <div class="admin-tabs" id="adminTabs">
      <button type="button" class="admin-tab active" data-tab="reorder">추가 발주</button>
      <button type="button" class="admin-tab" data-tab="history">재고 현황</button>
    </div>
    <div id="adminSummary"></div>
  </div>

      { label: '32온즈 돔 리드', segments: 3, note: '1/3 이하시 발주' },
      { label: '20·24온즈 돔 리드', qty: '2박스(20개입)' },
    ],
  ];

  const STORAGE_KEY = 'megacoffee-checklist-v1';
  const SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbzEffsg53ZmMEf_wTlUZ2eGZW4XVDHLPxna8uY8zlsGdlm64M2zbscE4ppKBNAWgJoI/exec';

  const FETCH_TIMEOUT_MS = 8000;

  function fetchWithTimeout(url, options) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
  }

  function pushValue(date, itemId, label, value) {
    fetchWithTimeout(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ date, itemId, label, value }),
    }).catch(() => {});
  }

  async function fetchDateValues(date) {
    try {
      const res = await fetchWithTimeout(`${SCRIPT_URL}?date=${encodeURIComponent(date)}`);
      const data = await res.json();
      return data.values || {};
    } catch (e) {
      return null;
    }
  }

  async function fetchDateList() {
    try {
      const res = await fetchWithTimeout(`${SCRIPT_URL}?dates=1`);
      const data = await res.json();
      return data.dates || [];
    } catch (e) {
      return [];
    }
  }

  const kstFormatter = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Seoul',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
  });
  function todayStr() {
    return kstFormatter.format(new Date());
  }

  function loadState() {
    let saved;
    try {
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    } catch (e) {
      saved = null;
    }
    if (!saved || saved.date !== todayStr()) {
      return { date: todayStr(), values: {} };
    }
    if (!saved.values) saved.values = {};
    return saved;
  }

  let state = loadState();

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  const sectionsEl = document.getElementById('sections');
  let idCounter = 0;
  let currentPage = 1;
  const itemRefs = {};

  DATA.forEach((items, pageIdx) => {
    const sectionEl = document.createElement('div');
    sectionEl.className = 'section';
    sectionEl.dataset.page = pageIdx + 1;

    items.forEach((item) => {
      const id = 'item-' + idCounter++;
      item._id = id;

      const row = document.createElement('div');
      row.className = 'item';
      row.dataset.id = id;

      const qtyMarkup = item.segments
        ? `
            <div class="seg-pill" id="seg-${id}">
              <div class="seg-indicator"></div>
              ${Array.from(
                { length: item.segments },
                (_, i) => `<button type="button" class="seg-btn" data-val="${i + 1}"></button>`,
              ).join('')}
            </div>
          `
        : `
            <div class="qty-wrap">
              <span class="paren">(</span><input
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                autocomplete="off"
                class="qty-input"
                placeholder="0"
                aria-label="${item.label} 발주 개수"
              /><span class="paren">/</span><span class="qty-target">${item.qty}</span><span class="paren">)</span>
            </div>
          `;

      row.innerHTML = `
        <div class="item-body">
          <div class="item-row">
            <div class="item-label">${item.label}</div>
            ${qtyMarkup}
          </div>
          ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
        </div>
      `;

      if (item.segments) {
        const pill = row.querySelector('.seg-pill');
        const indicator = pill.querySelector('.seg-indicator');
        const segBtns = pill.querySelectorAll('.seg-btn');

        function selectSeg(val) {
          indicator.style.width = `calc((100% - 6px) * ${val} / ${item.segments})`;
          pill.classList.add('picked');
          row.classList.add('filled');
        }

        function resetSeg() {
          indicator.style.width = '0%';
          pill.classList.remove('picked');
          row.classList.remove('filled');
        }

        const saved = state.values[id];
        if (saved !== undefined && saved !== '') {
          selectSeg(saved);
        }

        segBtns.forEach((btn) => {
          btn.addEventListener('click', () => {
            const val = btn.dataset.val;
            state.values[id] = val;
            selectSeg(val);
            updateProgress();
          });
        });

        itemRefs[id] = { item, row, selectSeg, resetSeg };
      } else {
        const input = row.querySelector('.qty-input');
        const saved = state.values[id];
        if (saved !== undefined && saved !== '') {
          input.value = saved;
          row.classList.add('filled');
        }

        input.addEventListener('input', () => {
          const digitsOnly = input.value.replace(/[^0-9]/g, '');
          if (digitsOnly !== input.value) input.value = digitsOnly;
          state.values[id] = input.value;
          row.classList.toggle('filled', input.value.trim() !== '');
          updateProgress();
        });

        itemRefs[id] = { item, row, input };
      }

      sectionEl.appendChild(row);
    });

    sectionsEl.appendChild(sectionEl);
  });

  function applyRemoteValue(id, val) {
    const ref = itemRefs[id];
    if (!ref) return;
    const strVal = String(val);
    if (state.values[id] === strVal) return;
    state.values[id] = strVal;
    if (ref.input) {
      ref.input.value = strVal;
      ref.row.classList.toggle('filled', strVal.trim() !== '');
    } else if (ref.selectSeg) {
      ref.selectSeg(strVal);
    }
  }

  function syncTodayFromServer() {
    fetchDateValues(state.date).then((remote) => {
      if (!remote) return;
      let changed = false;
      Object.keys(remote).forEach((id) => {
        if (state.values[id] !== String(remote[id])) {
          applyRemoteValue(id, remote[id]);
          changed = true;
        }
      });
      if (changed) {
        saveState();
        updateProgress();
      }
    });
  }

  const progressCountEl = document.getElementById('progressCount');
  const progressFillEl = document.getElementById('progressFill');

  function updateProgress() {
    const pageItems = document.querySelectorAll(
      `.section[data-page="${currentPage}"] .item`,
    );
    let done = 0;
    pageItems.forEach((el) => {
      if (el.classList.contains('filled')) done++;
    });
    const total = pageItems.length;
    progressCountEl.textContent = `${done} / ${total}`;
    progressFillEl.style.width = total > 0 ? `${(done / total) * 100}%` : '0%';
  }

  const totalPages = DATA.length;
  const bottomNav = document.getElementById('bottomNav');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageDotsEl = document.getElementById('pageDots');
  const saveBtn = document.getElementById('saveBtn');
  const sectionEls = document.querySelectorAll('.section');

  for (let i = 1; i <= totalPages; i++) {
    const dot = document.createElement('button');
    dot.className = 'page-dot';
    dot.setAttribute('aria-label', `${i} 페이지로 이동`);
    dot.addEventListener('click', () => showPage(i));
    pageDotsEl.appendChild(dot);
  }
  const dotEls = pageDotsEl.querySelectorAll('.page-dot');

  const PAGE_KEY = 'megacoffee-checklist-page';

  function showPage(n) {
    currentPage = Math.min(totalPages, Math.max(1, n));
    sectionEls.forEach((el) => {
      el.style.display = Number(el.dataset.page) === currentPage ? '' : 'none';
    });
    dotEls.forEach((dot, i) => dot.classList.toggle('active', i + 1 === currentPage));
    prevBtn.style.visibility = currentPage === 1 ? 'hidden' : 'visible';
    nextBtn.style.visibility = currentPage === totalPages ? 'hidden' : 'visible';
    saveBtn.classList.toggle('visible', currentPage === totalPages);
    updateProgress();
    window.scrollTo({ top: 0 });
    localStorage.setItem(PAGE_KEY, String(currentPage));
  }

  function loadSavedPage() {
    const p = parseInt(localStorage.getItem(PAGE_KEY), 10);
    return p >= 1 && p <= totalPages ? p : 1;
  }

  prevBtn.addEventListener('click', () => showPage(currentPage - 1));
  nextBtn.addEventListener('click', () => showPage(currentPage + 1));
  saveBtn.addEventListener('click', () => {
    saveState();
    Object.keys(state.values).forEach((id) => {
      const ref = itemRefs[id];
      if (!ref) return;
      const val = state.values[id];
      if (val === undefined || val === '') return;
      pushValue(state.date, id, ref.item.label, val);
    });
    const original = saveBtn.textContent;
    saveBtn.textContent = '저장됨 ✓';
    setTimeout(() => {
      saveBtn.textContent = original;
    }, 1200);
  });

  showPage(loadSavedPage());
  syncTodayFromServer();

  function resetForNewDay(newDate) {
    state = { date: newDate, values: {} };
    saveState();
    Object.keys(itemRefs).forEach((id) => {
      const ref = itemRefs[id];
      if (ref.input) {
        ref.input.value = '';
        ref.row.classList.remove('filled');
      } else if (ref.resetSeg) {
        ref.resetSeg();
      }
    });
    showPage(1);
    syncTodayFromServer();
  }

  let watchedDate = state.date;
  setInterval(() => {
    const t = todayStr();
    if (t !== watchedDate) {
      watchedDate = t;
      resetForNewDay(t);
    }
  }, 30000);

  /* ---------- Admin login & summary view ---------- */
  const ADMIN_PIN = '1234';
  const sheetEl = document.getElementById('sheet');
  const eyebrowWrap = document.getElementById('eyebrowWrap');
  const eyebrowBtn = document.getElementById('eyebrowBtn');
  const adminInlineLogin = document.getElementById('adminInlineLogin');
  const adminPassInput = document.getElementById('adminPassInput');
  const adminError = document.getElementById('adminError');
  const adminView = document.getElementById('adminView');
  const adminBackBtn = document.getElementById('adminBackBtn');
  const adminSummaryEl = document.getElementById('adminSummary');
  const adminDateSelect = document.getElementById('adminDateSelect');

  function openAdminLogin() {
    adminPassInput.value = '';
    adminError.hidden = true;
    eyebrowWrap.hidden = true;
    adminInlineLogin.hidden = false;
    adminPassInput.focus();
  }
  function closeAdminLogin() {
    adminInlineLogin.hidden = true;
    eyebrowWrap.hidden = false;
  }

  function parseTargetNumber(qty) {
    const m = String(qty).match(/\d+/);
    return m ? parseInt(m[0], 10) : null;
  }

  function parseTargetParts(qty) {
    const m = String(qty).match(/^(\d+)(.*)$/);
    if (!m) return { num: null, unit: '' };
    return { num: parseInt(m[1], 10), unit: m[2].trim() };
  }

  function formatSavedValue(item, valuesMap) {
    const raw = valuesMap[item._id];
    if (raw === undefined || raw === '' || raw === null) {
      return { text: '입력 안 함', cls: 'a-empty' };
    }
    const target = item.segments ? item.segments : parseTargetNumber(item.qty);
    const text = item.segments ? `${raw} / ${item.segments}` : `${raw} / ${item.qty}`;
    const rawNum = Number(raw);
    let cls = 'a-equal';
    if (target !== null && !Number.isNaN(rawNum)) {
      if (rawNum < target) cls = 'a-under';
      else if (rawNum > target) cls = 'a-over';
      else cls = 'a-equal';
    }
    return { text, cls };
  }

  function buildAdminSummary(valuesMap) {
    adminSummaryEl.innerHTML = '';
    DATA.forEach((items, pageIdx) => {
      const pageLabel = document.createElement('div');
      pageLabel.className = 'admin-page-label';
      pageLabel.textContent = `${pageIdx + 1} 페이지`;
      adminSummaryEl.appendChild(pageLabel);

      items.forEach((item) => {
        const { text, cls } = formatSavedValue(item, valuesMap);
        const row = document.createElement('div');
        row.className = 'admin-row';
        row.innerHTML = `
          <span class="a-label">${item.label}</span>
          <span class="a-value ${cls}">${text}</span>
        `;
        adminSummaryEl.appendChild(row);
      });
    });
  }

  function buildReorderSummary(valuesMap) {
    adminSummaryEl.innerHTML = '';
    let any = false;

    DATA.forEach((items, pageIdx) => {
      const shortageItems = items.filter(
        (item) => formatSavedValue(item, valuesMap).cls === 'a-under',
      );
      if (!shortageItems.length) return;
      any = true;

      const pageLabel = document.createElement('div');
      pageLabel.className = 'admin-page-label';
      pageLabel.textContent = `${pageIdx + 1} 페이지`;
      adminSummaryEl.appendChild(pageLabel);

      shortageItems.forEach((item) => {
        const raw = valuesMap[item._id];
        const rawNum = Number(raw);
        let text;
        if (item.segments) {
          text = '발주';
        } else {
          const { num: target, unit } = parseTargetParts(item.qty);
          const missing = target !== null ? target - rawNum : null;
          text = missing !== null ? `${missing}${unit}` : '발주 필요';
        }
        const row = document.createElement('div');
        row.className = 'admin-row';
        row.innerHTML = `
          <span class="a-label">${item.label}</span>
          <span class="a-value a-under">${text}</span>
        `;
        adminSummaryEl.appendChild(row);
      });
    });

    if (!any) {
      adminSummaryEl.innerHTML = '<div class="admin-empty">발주가 필요한 항목이 없습니다</div>';
    }
  }

  let adminTab = 'reorder';
  let lastValuesMap = {};
  const adminTabBtns = document.querySelectorAll('.admin-tab');

  function renderAdminTab() {
    if (adminTab === 'reorder') buildReorderSummary(lastValuesMap);
    else buildAdminSummary(lastValuesMap);
  }

  adminTabBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      adminTab = btn.dataset.tab;
      adminTabBtns.forEach((b) => b.classList.toggle('active', b === btn));
      renderAdminTab();
    });
  });

  async function loadAdminDate(date) {
    adminSummaryEl.innerHTML = '<div class="admin-loading"><div class="admin-spinner"></div></div>';
    const remote = await fetchDateValues(date);
    lastValuesMap = remote || (date === state.date ? state.values : {});
    renderAdminTab();
  }

  async function enterAdminView() {
    sheetEl.style.display = 'none';
    bottomNav.style.display = 'none';
    adminView.hidden = false;

    adminTab = 'reorder';
    adminTabBtns.forEach((b) => b.classList.toggle('active', b.dataset.tab === 'reorder'));

    adminDateSelect.innerHTML = `<option value="${state.date}">${state.date}</option>`;
    adminDateSelect.value = state.date;
    loadAdminDate(state.date);

    const dates = await fetchDateList();
    if (dates.length) {
      adminDateSelect.innerHTML = dates
        .map((d) => `<option value="${d}">${d}</option>`)
        .join('');
      adminDateSelect.value = state.date;
    }
  }
  function exitAdminView() {
    adminView.hidden = true;
    sheetEl.style.display = '';
    bottomNav.style.display = '';
  }

  adminDateSelect.addEventListener('change', () => {
    loadAdminDate(adminDateSelect.value);
  });

  function tryAdminLogin() {
    if (adminPassInput.value === ADMIN_PIN) {
      closeAdminLogin();
      enterAdminView();
    } else {
      adminError.hidden = false;
      adminPassInput.value = '';
      adminPassInput.focus();
    }
  }

  eyebrowBtn.addEventListener('click', openAdminLogin);
  adminPassInput.addEventListener('input', () => {
    if (adminPassInput.value.length >= ADMIN_PIN.length) tryAdminLogin();
  });
  adminPassInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryAdminLogin();
    if (e.key === 'Escape') closeAdminLogin();
  });
  document.addEventListener('click', (e) => {
    if (adminInlineLogin.hidden) return;
    if (e.target === eyebrowBtn || adminInlineLogin.contains(e.target)) return;
    closeAdminLogin();
  });
  adminBackBtn.addEventListener('click', exitAdminView);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
