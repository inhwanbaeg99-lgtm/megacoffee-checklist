<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://script.google.com" crossorigin />
<link rel="dns-prefetch" href="https://script.google.com" />
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
<link rel="dns-prefetch" href="https://script.googleusercontent.com" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="MGC" />
<title>발주 체크리스트</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-blur: rgba(255, 255, 255, 0.72);
    --paper: #f2f4f6;
    --ink: #201d1a;
    --ink-sub: #7c766d;
    --line: #e1e5e9;
    --accent: #3182f6;
    --accent-soft: #3182f61a;
    --done: #b7b096;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --bg-blur: rgba(23, 24, 26, 0.72);
      --paper: #211f1c;
      --ink: #ece7de;
      --ink-sub: #8f887c;
      --line: #37342e;
      --accent: #5b9bf8;
      --accent-soft: #5b9bf826;
      --done: #5b5647;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a;
    --bg-blur: rgba(23, 24, 26, 0.72);
    --paper: #211f1c;
    --ink: #ece7de;
    --ink-sub: #8f887c;
    --line: #37342e;
    --accent: #5b9bf8;
    --accent-soft: #5b9bf826;
    --done: #5b5647;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --bg-blur: rgba(255, 255, 255, 0.72);
    --paper: #f2f4f6;
    --ink: #201d1a;
    --ink-sub: #7c766d;
    --line: #e1e5e9;
    --accent: #3182f6;
    --accent-soft: #3182f61a;
    --done: #b7b096;
  }

  * { box-sizing: border-box; }

  html {
    touch-action: manipulation;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 28px 16px 40px;
    touch-action: manipulation;
  }

  .sheet {
    max-width: 640px;
    margin: 0 auto;
  }

  /* ---------- Header (plain, fixed) ---------- */
  .top-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(to bottom, var(--bg) 55%, transparent 100%);
    padding: 24px 4px 28px;
    margin-bottom: -12px;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    height: 34px;
    margin-bottom: 14px;
  }
  .eyebrow[hidden] {
    display: none;
  }
  .eyebrow-btn {
    border: none;
    background: none;
    padding: 0;
    margin: 0;
    font-family: inherit;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--ink);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-track {
    flex: 1;
    height: 6px;
    border-radius: 999px;
    background: var(--accent-soft);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .progress-count {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
  }

  /* ---------- Section (ticket block) ---------- */
  .section {
    background: var(--paper);
    border-radius: 16px;
    margin-bottom: 14px;
    padding: 8px 22px 6px;
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .section > .item:last-child {
    border-bottom: none;
  }

  .item-body {
    flex: 1;
    min-width: 0;
  }
  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .item-label {
    min-width: 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
    overflow-wrap: break-word;
    transition: color 0.2s ease;
  }
  .qty-wrap {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 1px;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
  }
  .qty-wrap .paren {
    color: var(--ink);
  }
  .qty-wrap .qty-target {
    font-variant-numeric: tabular-nums;
  }
  .qty-input {
    width: 32px;
    height: 24px;
    line-height: 24px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--ink);
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
    margin: 0 2px;
    box-sizing: border-box;
    -webkit-appearance: none;
    appearance: none;
    -moz-appearance: textfield;
    box-shadow: none;
    transition: color 0.2s ease;
  }
  .qty-input::placeholder {
    color: var(--line);
    font-weight: 600;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .qty-input:focus {
    outline: none;
  }
  .item-note {
    font-size: 12.5px;
    color: var(--ink-sub);
    margin-top: 3px;
    line-height: 1.5;
    display: flex;
    gap: 5px;
  }
  .item-note::before {
    content: '·';
    color: var(--accent);
    font-weight: 800;
  }

  .item.filled .item-label {
    color: var(--ink);
  }
  .item.filled .qty-input {
    color: var(--accent);
  }

  .seg-pill {
    position: relative;
    flex: 0 0 auto;
    display: flex;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
    width: 138px;
  }
  .seg-indicator {
    position: absolute;
    top: 2px;
    left: 2px;
    height: calc(100% - 4px);
    width: 0;
    background: var(--accent);
    border-radius: 999px;
    opacity: 0;
    transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.2s ease;
    z-index: 0;
  }
  .seg-pill.picked .seg-indicator {
    opacity: 1;
  }
  .seg-btn {
    position: relative;
    z-index: 1;
    flex: 1;
    height: 26px;
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
    border-radius: 999px;
  }

  .bottom-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
  }
  .page-btn {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 999px;
    border: none;
    background: var(--paper);
    color: var(--ink);
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, background 0.2s ease;
  }
  .page-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .page-dots {
    display: flex;
    align-items: center;
  }
  .page-dot {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .page-dot::before {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--line);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .page-dot.active::before {
    background: var(--accent);
    transform: scale(1.35);
  }
  .save-btn {
    display: none;
    width: 100%;
    max-width: 220px;
    height: 40px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    margin: 4px auto 0;
  }
  .save-btn.visible {
    display: block;
  }

  .admin-inline-login {
    position: relative;
    height: 34px;
    margin-bottom: 14px;
  }
  .admin-pin-row {
    width: 184px;
    height: 100%;
  }
  .admin-pass-input {
    width: 100%;
    height: 100%;
    text-align: center;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.2em;
    color: var(--ink);
    background: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 0;
    box-sizing: border-box;
    transition: background 0.4s ease, color 0.4s ease;
  }
  .admin-pass-input:focus {
    outline: none;
  }
  .admin-pass-input.shake {
    background: #e0483e26;
    color: #e0483e;
    animation: admin-pin-shake 0.4s ease;
  }
  @keyframes admin-pin-shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .admin-pass-input.shake {
      animation: none;
    }
  }
  .admin-btn {
    flex: 1;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .admin-view {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 0 60px;
  }
  .admin-view-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 34px;
    margin-bottom: 14px;
  }
  .admin-view-title {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-left: 0;
  }
  .admin-view .admin-btn {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .admin-date-select {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    background: var(--paper);
    border: none;
    border-radius: 10px;
    padding: 10px 28px 10px 12px;
    margin-bottom: 16px;
    box-sizing: border-box;
  }
  #adminTabs[hidden] { display:none; }
  .admin-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .admin-tab {
    flex: 1;
    height: 36px;
    border: none;
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .admin-tab.active {
    background: var(--accent);
    color: #fff;
  }
  .admin-empty {
    padding: 28px 2px;
    text-align: center;
    color: var(--ink-sub);
    font-size: 14px;
  }
  .admin-loading {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 220px);
  }
  .admin-spinner {
    width: 26px;
    height: 26px;
    border-radius: 999px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    animation: admin-spin 0.7s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .admin-spinner {
      animation: none;
    }
  }
  @keyframes admin-spin {
    to {
      transform: rotate(360deg);
    }
  }
  .admin-page-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 20px 2px 6px;
  }
  .admin-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 2px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .admin-row .a-label {
    color: var(--ink);
    font-weight: 600;
  }
  .admin-row .a-value {
    flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--ink-sub);
  }
  .admin-row .a-value.a-empty {
    color: var(--line);
  }
  .admin-row .a-value.a-under {
    color: #e0483e;
  }
  .admin-row .a-value.a-equal {
    color: var(--accent);
  }
  .admin-row .a-value.a-over {
    color: var(--accent);
  }
  .quantity-keypad[hidden] { display: none; }
  .quantity-keypad { width: 100%; background: transparent; color: var(--ink); padding: 12px 0 20px; }
  #adminKeypad { background: var(--paper); border-radius: 16px; margin-bottom: 14px; padding: 16px 22px; }
  html, body, body * { touch-action: manipulation; scrollbar-width: none; }
  ::-webkit-scrollbar { display: none; width: 0; height: 0; }
  #targetEditorFields { margin-top: 0; margin-bottom: 16px; }
  .target-page-tools { display: flex; justify-content: flex-end; gap: 12px; padding: 0; }
  .target-order-edit { font-size:16px !important; }
  .target-page-add { display:flex; align-items:center; justify-content:center; width:calc(100% + 44px); margin:0 -22px -16px; padding:14px 16px; border:0; border-top:0; border-radius:0; background:transparent; color:var(--ink-sub); cursor:pointer; }
  .target-select { display:none; width:24px; height:24px; border:2px solid var(--line); border-radius:50%; background:transparent; color:var(--line); padding:0; flex-shrink:0; touch-action:manipulation; }
  .target-select[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .target-edit-page.order-editing .target-select { display:inline-flex; align-items:center; justify-content:center; }
  .drag-preview .target-select { display:inline-flex; align-items:center; justify-content:center; }
  .drag-preview { border:0; }
  .target-item-name { display:flex; align-items:center; gap:8px; min-width:0; font-size:16px; font-weight:700; }
  #addItemBack { width:38px; height:38px; }
  #addItemBack svg { width:20px; height:20px; }
  .target-add-btn { border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  #addItemDialog { width: 100%; margin-top: 16px; box-sizing: border-box; border: 0; border-radius: 16px; padding: 24px; background: transparent; color: var(--ink); font-family: inherit; }
  .add-item-heading { display:flex; align-items:center; gap:10px; font-weight:700; }
  #addItemDialog input:focus { outline:none; border:none; box-shadow:none; }
  .admin-sticky-header { position:sticky; top:0; z-index:10; background:var(--bg); padding:24px 4px 0; margin-bottom:0; }
  .admin-sticky-header::after { content:""; position:absolute; top:100%; left:0; right:0; height:24px; background:linear-gradient(to bottom,var(--bg),transparent); pointer-events:none; }
  #targetPageNav { position:static; background:transparent; margin:12px 0 16px; padding:0; }
  #addItemDialog label { display: block; margin: 12px 0; font-size: 14px; font-weight: 700; }
  #addItemDialog input, #addItemDialog select { display: block; width: 100%; box-sizing: border-box; margin-top: 8px; padding: 10px; border: 0; border-radius: 10px; font-family: inherit; font-size: 16px; background: var(--bg); color: var(--ink); }
  .target-edit-page { background: transparent; border-radius: 0; padding: 8px 22px 16px; }
  .target-edit-page.order-editing .target-edit-row { touch-action:pan-y; user-select:none; width:calc(100% + 44px); margin:0 -22px; padding:10px 22px; }
  .target-edit-page.order-editing .target-item-name, .drag-preview .target-item-name { padding-left:34px; }
  .target-edit-page.order-editing .target-edit-row.selected { background:color-mix(in srgb,var(--bg) 92%,var(--ink) 8%); }
  .target-item-name { position:relative; }
  .target-select { position:absolute; left:0; top:50%; margin-top:-12px; }
  .order-mode, .order-mode * { user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .target-edit-row.dragging { opacity: .2; }
  .drag-preview { position: fixed; pointer-events: none; z-index: 999; margin: 0; background: color-mix(in srgb, var(--bg) 92%, var(--ink) 8%); border-radius: 0; box-shadow: none; opacity: .98; will-change: transform; }
  .add-type-row { display: flex; gap: 8px; }
  .add-type-row button { flex: 1; }
  .new-item-quantity { display:flex; align-items:center; background:var(--bg); border-radius:10px; margin-top:12px; padding:0 8px; }
  #addItemDialog .new-item-quantity input { min-width:0; flex:1; width:auto; margin:0; background:transparent; }
  .unit-toggle { display:flex; gap:4px; flex-shrink:0; }
  .unit-toggle button { border:0; border-radius:8px; padding:8px 10px; font-family:inherit; font-size:14px; font-weight:700; color:var(--ink-sub); background:transparent; }
  .unit-toggle button.active { color:var(--accent); background:var(--accent-soft); }
  .order-controls { display: none; gap: 4px; grid-column: 1 / -1; justify-content: flex-end; }
  .order-controls button { width: 36px; height: 32px; border: 0; border-radius: 8px; background: var(--bg); color: var(--ink); cursor: pointer; font-size: 18px; }
  .order-controls button:disabled { opacity: .25; cursor: default; }
  .target-edit-page[hidden] { display: none; }
  .target-edit-row > label { font-size: 16px; font-weight: 700; line-height: 1.4; }
  .target-edit-row > label.threshold-label { font-size: 13px; font-weight: 500; color: var(--ink-sub); }
  #targetEditorStatus { font-size: 13px; color: var(--ink-sub); line-height: 1.5; }
  .target-edit-row { display: grid; grid-template-columns: minmax(0,1fr) 90px; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .target-edit-page.order-editing input { pointer-events: none; opacity: 1; -webkit-text-fill-color:#000; }
  .target-edit-row input { width: 1ch; min-width:10px; max-width:90px; justify-self:end; font-family: inherit; font-size: 16px; font-weight: 700; text-align: right; padding: 8px 0; border: none; outline: none; box-shadow: none; border-radius: 10px; color: var(--accent); background: transparent; }
  .target-edit-page.order-editing .target-page-add { display:none; }
  .target-edit-page.order-editing .target-edit-row input,
  .target-edit-page.order-editing .threshold-label,
  .target-edit-page.order-editing .target-edit-row small,
  .drag-preview input, .drag-preview .threshold-label, .drag-preview small { display:none; }
  .order-mode .target-page-tools, .order-mode #targetEditorActions, .order-mode #targetEditorStatus { display:none; }
  body.inventory-order-mode { padding-bottom:calc(130px + env(safe-area-inset-bottom)); }
  #orderDoneBar[hidden] { display:none; }
  #orderDoneBar { display:flex; gap:10px; position:fixed; bottom:4px; left:50%; transform:translateX(-50%); width:min(100%,672px); padding:24px 16px calc(20px + env(safe-area-inset-bottom)); background:linear-gradient(to bottom,transparent,var(--bg) 28%); z-index:30; }
  #orderDeleteBtn[hidden] { display:none; }
  #orderDeleteBtn { color:#e0483e !important; }
  #orderDoneBtn, #orderDeleteBtn { width:100%; height:56px; border:0; border-radius:16px; background:var(--paper); color:var(--ink); font-family:inherit; font-size:18px; font-weight:700; cursor:pointer; }
  .reorder-indicator { display:none; justify-self:end; color:var(--ink-sub); align-items:center; }
  .target-edit-page.order-editing .reorder-indicator, .drag-preview .reorder-indicator { display:flex; }
  .target-edit-row input { color:#000; border-bottom:0; border-radius:0; }
  .target-edit-row input.active-target { color:var(--accent); }
  #adminTabs { margin-bottom:14px; }
  .admin-view:has(#targetEditor:not([hidden])) #adminTabs { margin-bottom:4px; }
  body.inventory-target-view { padding-bottom:calc(130px + env(safe-area-inset-bottom)); }
  #targetEditorActions { position:fixed; bottom:4px; left:50%; transform:translateX(-50%); width:min(100%,672px); padding:24px 16px calc(20px + env(safe-area-inset-bottom)); background:linear-gradient(to bottom,transparent,var(--bg) 28%); z-index:29; margin:0; }
  #saveTargetsBtn, #confirmAddItem { width:100%; height:56px; flex:auto; border:0; border-radius:16px; background:var(--paper); color:var(--ink); font-family:inherit; font-size:18px; font-weight:700; }
  #addItemDialog .add-type-row button { height:56px; border-radius:16px; font-size:16px; }
  #addItemDialog input, #addItemDialog .new-item-quantity { background:var(--paper); }
  #addItemDialog input { margin:20px 0; min-height:60px; padding:16px; }
  #addItemDialog .add-item-heading { margin-bottom:24px; }
  #addItemDialog .add-type-row { margin:24px 0 20px; }
  #addItemDialog .new-item-quantity { min-height:60px; margin-top:20px; }
  #addItemDialog .new-item-quantity input { min-height:60px; padding:16px 8px; }

      { label: '20·24온즈 돔 리드', qty: '2박스' },

      { label: '(Hot) 20온즈 리드', segments: 3, note: '1/3 이하시 발주' },

  ];

  const CUSTOM_ITEMS_KEY = 'megacoffee-custom-items-v1';
  const CUSTOM_ITEMS_ID = '__custom_items__';
  let customItems = [];
  try { const saved = JSON.parse(localStorage.getItem(CUSTOM_ITEMS_KEY)); if (Array.isArray(saved)) customItems = saved; } catch {}
  function addCustomItemsToData(items) {
    let added = false;
    for (const item of items) {
      if (!item || !Number.isInteger(item.page) || item.page < 1 || item.page > 5 ||
          typeof item.label !== 'string' || !item.label.trim() || item.label.length > 60 || /[<>&"']/.test(item.label) ||
          [CUSTOM_ITEMS_ID, '__item_order__', '__deleted_items__'].includes(item.label) ||
          (item.segments !== 3 && !/^\d{1,6}(개|박스|통|봉)$/.test(item.qty))) continue;
      if (DATA.flat().some(existing => existing.label === item.label)) continue;
      DATA[item.page-1].push(item.segments === 3 ? {label:item.label, segments:3, note:'1/3 이하시 발주'} : {label:item.label, qty:item.qty, ...(Number.isInteger(item.orderThreshold) && item.orderThreshold>=0 ? {orderThreshold:item.orderThreshold} : {})});
      added = true;
    }
    return added;
  }
  addCustomItemsToData(customItems);
  const DELETED_KEY = 'megacoffee-deleted-items-v1';
  const DELETED_ID = '__deleted_items__';
  let deletedItems=[];
  try { const saved=JSON.parse(localStorage.getItem(DELETED_KEY)); if(Array.isArray(saved))deletedItems=saved; } catch {}
  function applyDeletedItems() {
    let changed=false;
    DATA.forEach((items,index)=>{ const filtered=items.filter(item=>!deletedItems.includes(item.label)); if(filtered.length!==items.length){DATA[index]=filtered;changed=true;} });
    return changed;
  }
  applyDeletedItems();
  const ORDER_KEY = 'megacoffee-item-order-v1';
  const ORDER_ID = '__item_order__';
  function applyItemOrder(order) {
    if (!Array.isArray(order)) return false;
    let changed = false;
    DATA.forEach((items, index) => {
      if (!Array.isArray(order[index])) return;
      const ordered = [];
      for (const label of order[index]) {
        const item = items.find(item => item.label === label);
        if (item && !ordered.includes(item)) ordered.push(item);
      }
      ordered.push(...items.filter(item => !ordered.includes(item)));
      if (ordered.some((item, i) => item !== items[i])) { items.splice(0, items.length, ...ordered); changed = true; }
    });
    return changed;
  }
  try { applyItemOrder(JSON.parse(localStorage.getItem(ORDER_KEY))); } catch {}

  const TARGETS_KEY = 'megacoffee-targets-v1';
  const TARGETS_DATE = 'settings';
  let targetSettings = {};
  try { targetSettings = JSON.parse(localStorage.getItem(TARGETS_KEY)) || {}; } catch {}
  function applyTargetSettings(settings) {
    DATA.flat().forEach(item => {
      const config = settings[item.label];
      if (!config || item.segments) return;
      if (Number.isInteger(config.qty) && config.qty >= 0 && config.qty <= 999999) {
        item.qty = `${config.qty}${item.qty.replace(/[0-9]+/, '')}`;
      }
      if (item.orderThreshold !== undefined && Number.isInteger(config.threshold) && config.threshold >= 0 && config.threshold <= 999999) {
        item.orderThreshold = config.threshold;
      }
    });
  }
  applyTargetSettings(targetSettings);
  const STORAGE_KEY = 'megacoffee-checklist-v1';
  const SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbzEffsg53ZmMEf_wTlUZ2eGZW4XVDHLPxna8uY8zlsGdlm64M2zbscE4ppKBNAWgJoI/exec';

  const FETCH_TIMEOUT_MS = 15000;

  function fetchWithTimeout(url, options) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
  }

  const PENDING_KEY = 'megacoffee-pending-v1';
  let pendingValues = {};
  try { pendingValues = JSON.parse(localStorage.getItem(PENDING_KEY)) || {}; } catch {}
  const confirmedValues = {};
  const localEditVersions = {};
  let editVersion = 0;
  let savingPromise = null;
  let saveTimer = null;
  function persistPending() { localStorage.setItem(PENDING_KEY, JSON.stringify(pendingValues)); }
  function queueValue(date, itemId, label, value) {
    const key = `${date}:${itemId}`;
    localEditVersions[key] = ++editVersion;
    if (!pendingValues[key] && confirmedValues[key] === String(value)) return;
    if (pendingValues[key] && String(pendingValues[key].value) === String(value)) return;
    pendingValues[key] = { date, itemId, label, value };
    persistPending();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => flushPending().catch(() => {}), 800);
  }
  async function flushPending() {
    if (savingPromise) return savingPromise;
    savingPromise = (async () => {
      while (Object.keys(pendingValues).length) {
        const key = Object.keys(pendingValues)[0];
        const entry = pendingValues[key];
        const res = await fetchWithTimeout(SCRIPT_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(entry),
        });
        if (!res.ok) throw new Error('서버 저장 실패');
        const result = await res.json();
        if (!result.ok) throw new Error('서버 저장 확인 실패');
        confirmedValues[key] = String(entry.value);
        if (pendingValues[key] === entry) delete pendingValues[key];
        persistPending();
      }
    })();
    try { await savingPromise; } finally { savingPromise = null; }
  }
  window.addEventListener('online', () => flushPending().catch(() => {}));
  setInterval(() => { if (Object.keys(pendingValues).length) flushPending().catch(() => {}); }, 30000);

  async function fetchDateValues(date) {
    try {
      const res = await fetchWithTimeout(`${SCRIPT_URL}?date=${encodeURIComponent(date)}`);
      const data = await res.json();
      const values = data.values || {};
      Object.entries(values).forEach(([id, value]) => { confirmedValues[`${date}:${id}`] = String(value); });
      return values;
    } catch (e) {
      return null;
    }
  }

  async function fetchDateList() {
    try {
      const res = await fetchWithTimeout(`${SCRIPT_URL}?dates=1`);
      const data = await res.json();
      return (data.dates || []).filter(date => /^\d{4}-\d{2}-\d{2}$/.test(date));
    } catch (e) {

      return { date: todayStr(), values: {} };
    }
    if (!saved.values) saved.values = {};

  const quantityClearButton = quantityKeypad.querySelector('[data-key="clear"]');
  const quantityDeleteIcon = quantityClearButton.innerHTML;
  function updateQuantityClearButton() {
    const hasValue = !!activeQuantityInput?.value.trim();

    quantityClearButton.innerHTML = hasValue ? quantityDeleteIcon : '←';

  function closeQuantityKeypad() {

    activeQuantityInput = null;
    currentScrollItem = null;
    inputScrollSpace.style.height = '0px';
  }
  function scrollToInputItem(row) {
    currentScrollItem = row;
    requestAnimationFrame(() => {
      if (currentScrollItem !== row || !row.isConnected) return;
      inputScrollSpace.style.height = '0px';
      const firstRow = row.closest('.section, .target-edit-page').querySelector('.item, .target-edit-row');
      const firstItemTop = firstRow.getBoundingClientRect().top + window.scrollY;
      const rowTop = row.getBoundingClientRect().top + window.scrollY;
      const targetTop = Math.max(0, rowTop - firstItemTop);
      const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      inputScrollSpace.style.height = `${Math.max(0, Math.ceil(targetTop - maxScroll))}px`;
      window.scrollTo({ top: targetTop,
        behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
    });
  }
  window.addEventListener('resize', () => {
    if (currentScrollItem) scrollToInputItem(currentScrollItem);
  });
  function openQuantityKeypad(input) {
    activeQuantityInput = input;
    replaceQuantity = true;
    updateQuantityClearButton();
    input.closest('.item').after(quantityKeypad);
    quantityKeypad.hidden = false;
    document.body.classList.add('keypad-open');
    input.focus({ preventScroll: true });
    scrollToInputItem(input.closest('.item'));
  }
  quantityKeypad.addEventListener('pointerdown', e => e.preventDefault());
  quantityKeypad.addEventListener('click', e => {
    const key = e.target.closest('[data-key]')?.dataset.key;
    if (!key || !activeQuantityInput) return;
    const input = activeQuantityInput;
    if (key === 'clear' && input.value.trim() === '') {
      const row = input.closest('.item');
      const items = [...row.closest('.section').querySelectorAll('.item')];
      const previous = items[items.indexOf(row) - 1];
      if (previous) activateItem(previous);
      return;
    }
    if (key === 'clear') input.value = '';
    else if (key === 'backspace') input.value = input.value.slice(0, -1);
    else input.value = ((replaceQuantity ? '' : input.value) + key).replace(/^0+(?=\d)/, '').slice(0, 6);
    replaceQuantity = false;
    input.dispatchEvent(new Event('input', { bubbles: true }));
  });
  function activateItem(row) {
    const input = row.querySelector('.qty-input');
    if (input) openQuantityKeypad(input);
    else {
      closeQuantityKeypad();
      row.querySelector('.seg-btn')?.focus({ preventScroll: true });
      scrollToInputItem(row);

  function validateCurrentPage() {
    const rows = [...document.querySelectorAll(`.section[data-page="${currentPage}"] .item`)];
    const missing = rows.find(row => {

      return value === undefined || value === null || String(value).trim() === '';

    if (missing) {
      document.querySelectorAll('.required-message').forEach(el => el.remove());
      const message = document.createElement('div');
      message.className = 'required-message';
      message.setAttribute('role', 'alert');

      activateItem(missing);
      return false;

    return true;

      row.innerHTML = `

      if (item.segments) {
        const pill = row.querySelector('.seg-pill');
        const indicator = pill.querySelector('.seg-indicator');
        const segBtns = pill.querySelectorAll('.seg-btn');

        function selectSeg(val) {
          indicator.style.width = `calc((100% - 6px) * ${val} / ${item.segments})`;
          pill.classList.add('picked');
          row.classList.add('filled');
        }

        function resetSeg() {
          indicator.style.width = '0%';
          pill.classList.remove('picked');
          row.classList.remove('filled');
        }

        const saved = state.values[id];
        if (saved !== undefined && saved !== '') {
          selectSeg(saved);
        }

        segBtns.forEach((btn) => {
          btn.addEventListener('click', () => {
            const val = btn.dataset.val;
            state.values[id] = val;
            queueValue(state.date, id, item.label, val);
            selectSeg(val);
            saveState();
            updateProgress();
            advanceFromItem(row);
          });
        });

        itemRefs[id] = { item, row, selectSeg, resetSeg };
      } else {
        const input = row.querySelector('.qty-input');
        const saved = state.values[id];
        if (saved !== undefined && saved !== '') {
          input.value = saved;
          row.classList.add('filled');
        }

        input.addEventListener('input', () => {
          const digitsOnly = input.value.replace(/[^0-9]/g, '');
          if (digitsOnly !== input.value) input.value = digitsOnly;
          state.values[id] = input.value;
          queueValue(state.date, id, item.label, input.value);
          if (activeQuantityInput === input) updateQuantityClearButton();
          row.classList.toggle('filled', input.value.trim() !== '');
          saveState();
          updateProgress();
        });
        input.addEventListener('focus', () => {
          input.placeholder = '';
          openQuantityKeypad(input);
        });
        input.addEventListener('click', () => openQuantityKeypad(input));
        input.addEventListener('keydown', e => {
          if (e.key === 'Escape') closeQuantityKeypad();
          else if (/^[0-9]$/.test(e.key) || e.key === 'Backspace') {
            e.preventDefault();
            if (e.key === 'Backspace') {
              input.value = input.value.slice(0, -1);
              replaceQuantity = false;
              input.dispatchEvent(new Event('input', { bubbles: true }));
            } else quantityKeypad.querySelector(`[data-key="${e.key}"]`).click();
          }
        });
        input.addEventListener('blur', () => {
          if (input.value === '') input.placeholder = '0';
        });

        itemRefs[id] = { item, row, input };
      }

      sectionEl.appendChild(row);
    });

    sectionsEl.appendChild(sectionEl);
  });

  function applyRemoteValue(id, val) {
    const ref = itemRefs[id];
    if (!ref) return;
    const strVal = String(val);
    if (state.values[id] === strVal) return;
    state.values[id] = strVal;
    if (ref.input) {
      ref.input.value = strVal;
      if (activeQuantityInput === ref.input) updateQuantityClearButton();
      ref.row.classList.toggle('filled', strVal.trim() !== '');
    } else if (ref.selectSeg) {
      if (strVal === '') ref.resetSeg(); else ref.selectSeg(strVal);
    }
  }

  function syncTodayFromServer() {
    const requestedDate = state.date;
    const versionsAtStart = {...localEditVersions};
    const pendingAtStart = new Set(Object.keys(pendingValues));
    fetchDateValues(requestedDate).then((remote) => {
      if (!remote || state.date !== requestedDate) return;
      Object.entries(state.values).forEach(([id, value]) => {
        if (!(id in remote) && value !== '' && itemRefs[id]) {
          queueValue(state.date, id, itemRefs[id].item.label, value);
        }
      });
      let changed = false;
      Object.keys(remote).forEach((id) => {
        const key = `${requestedDate}:${id}`;
        if (!pendingAtStart.has(key) && !pendingValues[key] && localEditVersions[key] === versionsAtStart[key] && state.values[id] !== String(remote[id])) {
          applyRemoteValue(id, remote[id]);
          changed = true;
        }
      });
      if (changed) {
        saveState();
        updateProgress();
      }
    });
  }

  const progressCountEl = document.getElementById('progressCount');
  const progressFillEl = document.getElementById('progressFill');

  function updateProgress() {
    document.querySelectorAll('.item.filled .required-message').forEach(el => el.remove());
    const pageItems = document.querySelectorAll(
      `.section[data-page="${currentPage}"] .item`,
    );
    let done = 0;
    pageItems.forEach((el) => {
      if (el.classList.contains('filled')) done++;
    });
    const total = pageItems.length;
    progressCountEl.textContent = `${done} / ${total}`;
    progressFillEl.style.width = total > 0 ? `${(done / total) * 100}%` : '0%';
  }

  const totalPages = DATA.length;
  const bottomNav = document.getElementById('bottomNav');

    dot.disabled = true;
    dot.style.cursor = 'default';
    pageDotsEl.appendChild(dot);

  const PAGE_KEY = 'megacoffee-checklist-page';

  function showPage(n) {
    closeQuantityKeypad();

    sectionEls.forEach((el) => {
      el.style.display = Number(el.dataset.page) === currentPage ? '' : 'none';
    });
    dotEls.forEach((dot, i) => dot.classList.toggle('active', i + 1 === currentPage));
    prevBtn.style.visibility = currentPage === 1 ? 'hidden' : 'visible';
    nextBtn.style.visibility = currentPage === totalPages ? 'hidden' : 'visible';
    saveBtn.classList.add('visible');
    saveBtn.textContent = currentPage === totalPages ? '저장' : '다음 페이지';
    updateProgress();
    window.scrollTo({ top: 0 });
    localStorage.setItem(PAGE_KEY, String(currentPage));
    const firstInput = document.querySelector(`.section[data-page="${currentPage}"] .qty-input`);
    if (firstInput) openQuantityKeypad(firstInput);
  }

  const navigationStatus = document.createElement('div');
  navigationStatus.className = 'required-message';
  navigationStatus.setAttribute('role', 'status');
  bottomNav.after(navigationStatus);
  let pageSaveInProgress = false;
  async function saveAndNavigate(targetPage, requireComplete) {
    if (pageSaveInProgress) return;
    const rows = [...document.querySelectorAll(`.section[data-page="${currentPage}"] .item`)];
    if (requireComplete && !validateCurrentPage()) return;
    saveState();
    rows.forEach(row => {
      const id = row.dataset.id;
      const ref = itemRefs[id];
      if (!ref) return;
      const val = state.values[id];
      if (val === undefined || val === '') return;
      queueValue(state.date, id, ref.item.label, val);
    });
    if (!requireComplete) {
      showPage(targetPage);
      navigationStatus.textContent = '';
      flushPending().catch(() => {});
      return;
    }
    const previousText = saveBtn.textContent;
    pageSaveInProgress = true;
    prevBtn.disabled = nextBtn.disabled = true;
    bottomNav.inert = true;
    saveBtn.disabled = true;
    saveBtn.textContent = '저장 중…';
    navigationStatus.textContent = '서버에 저장 중…';
    let navigationTimeout;
    try {
      await Promise.race([flushPending(), new Promise((_, reject) => {
        navigationTimeout = setTimeout(() => reject(new Error('저장 지연')), 20000);
      })]);
      navigationStatus.textContent = '';
      showPage(targetPage);
    } catch {
      saveBtn.textContent = '저장 실패 · 다시 눌러 주세요';
      navigationStatus.textContent = '저장이 지연되거나 실패했습니다. 입력은 기기에 보관됩니다. 버튼을 다시 눌러 주세요.';
      return;
    } finally {
      clearTimeout(navigationTimeout);
      pageSaveInProgress = false;
      prevBtn.disabled = nextBtn.disabled = false;
      bottomNav.inert = false;
      saveBtn.disabled = false;
      if (saveBtn.textContent === '저장 중…') saveBtn.textContent = previousText;
    }
  }
  prevBtn.addEventListener('click', () => saveAndNavigate(currentPage - 1, false));
  nextBtn.addEventListener('click', () => saveAndNavigate(currentPage + 1, true));
  saveBtn.addEventListener('click', () => saveAndNavigate(currentPage < totalPages ? currentPage + 1 : 1, true));

  function parseTargetNumber(qty) {
    const m = String(qty).match(/\d+/);
    return m ? parseInt(m[0], 10) : null;
  }

  function parseTargetParts(qty) {
    const m = String(qty).match(/^(\d+)(.*)$/);
    if (!m) return { num: null, unit: '' };
    return { num: parseInt(m[1], 10), unit: m[2].trim() };
  }

  function formatSavedValue(item, valuesMap) {
    const raw = valuesMap[item._id];
    if (raw === undefined || raw === '' || raw === null) {
      return { text: '입력 안 함', cls: 'a-empty' };
    }
    const target = item.segments ? item.segments : parseTargetNumber(item.qty);
    const text = item.segments ? `${raw} / ${item.segments}` : `${raw} / ${item.qty}`;
    const rawNum = Number(raw);
    let cls = 'a-equal';
    if (target !== null && !Number.isNaN(rawNum)) {
      const isUnder = item.orderThreshold !== undefined ? rawNum <= item.orderThreshold : rawNum < target;
      if (isUnder) cls = 'a-under';
      else if (rawNum > target) cls = 'a-over';
      else cls = 'a-equal';
    }
    return { text, cls };
  }

  function buildAdminSummary(valuesMap) {
    adminSummaryEl.innerHTML = '';
    DATA.forEach((items, pageIdx) => {
      const pageLabel = document.createElement('div');
      pageLabel.className = 'admin-page-label';
      pageLabel.textContent = `${pageIdx + 1} 페이지`;
      adminSummaryEl.appendChild(pageLabel);

      items.forEach((item) => {

        const row = document.createElement('div');
        row.className = 'admin-row';
        row.innerHTML = `
          <span class="a-label">${item.label}</span>
          <span class="a-value ${cls}">${text}</span>
        `;
        adminSummaryEl.appendChild(row);
      });
    });
  }

  function buildReorderSummary(valuesMap) {
    adminSummaryEl.innerHTML = '';
    let any = false;

    DATA.forEach((items, pageIdx) => {
      const shortageItems = items.filter(
        (item) => formatSavedValue(item, valuesMap).cls === 'a-under',
      );
      if (!shortageItems.length) return;
      any = true;

      const pageLabel = document.createElement('div');
      pageLabel.className = 'admin-page-label';
      pageLabel.textContent = `${pageIdx + 1} 페이지`;
      adminSummaryEl.appendChild(pageLabel);

      shortageItems.forEach((item) => {
        const raw = valuesMap[item._id];
        const rawNum = Number(raw);
        let text;
        if (item.segments || item.orderThreshold !== undefined) {
          text = '발주';
        } else {
          const { num: target, unit } = parseTargetParts(item.qty);
          const missing = target !== null ? target - rawNum : null;
          text = missing !== null ? `${missing}${unit}` : '발주 필요';
        }
        const row = document.createElement('div');
        row.className = 'admin-row';
        row.innerHTML = `
          <span class="a-label">${item.label}</span>
          <span class="a-value a-under">${text}</span>
        `;
        adminSummaryEl.appendChild(row);
      });
    });

  function setOrderEditing(editing) {

    targetEditor.classList.toggle('order-mode',editing);

    saveTargetDraft();
    const threshold = document.getElementById('newItemThreshold').value;
    if (newItemType==='count' && threshold!=='' && !/^\d{1,6}$/.test(threshold)) {status.textContent='발주 기준을 확인해 주세요.';return;}
    const record = newItemType === 'segments' ? {page:addingPage,label,segments:3} : {page:addingPage, label, qty:`${Number(qty)}${newItemUnit}`, ...(threshold!==''?{orderThreshold:Number(threshold)}:{})};
    customItems.push(record);
    localStorage.setItem(CUSTOM_ITEMS_KEY, JSON.stringify(customItems));
    queueValue(TARGETS_DATE, CUSTOM_ITEMS_ID, CUSTOM_ITEMS_ID, JSON.stringify(customItems));
    addCustomItemsToData([record]);
    renderChecklistItems(); sectionEls = document.querySelectorAll('.section');
    showPage(currentPage); closeQuantityKeypad();
    addItemDialog.hidden = true;
    document.getElementById('editTargetsBtn').click();
    showTargetPage(addingPage);
    flushPending().catch(() => { targetEditorStatus.textContent = '품목이 기기에 추가됐으며 서버 저장은 자동으로 재시도합니다.'; });
  });
  targetEditor.addEventListener('submit', async event => {
    event.preventDefault();
    const invalidInput = [...targetEditorFields.querySelectorAll('input')].find(input => !/^\d{1,6}$/.test(input.value));
    if (invalidInput) { targetEditorStatus.textContent = '수량을 입력해 주세요.'; openTargetKeypad(invalidInput); return; }
    const button = document.getElementById('saveTargetsBtn');
    saveTargetDraft();
    button.disabled = true;
    targetEditorStatus.textContent = '저장 중…';
    try {
      await flushPending();
      closeTargetEditor();
      renderAdminTab();
    } catch {
      targetEditorStatus.textContent = '서버 저장 대기 중입니다. 변경값은 기기에 보관되며 자동으로 재시도합니다.';
    } finally { button.disabled = false; }
  });
  syncTargetSettings();

  let adminTab = 'reorder';
  let lastValuesMap = {};
  const adminTabBtns = document.querySelectorAll('.admin-tab[data-tab]');

  function renderAdminTab() {
    if (adminTab === 'reorder') buildReorderSummary(lastValuesMap);
    else buildAdminSummary(lastValuesMap);
  }

  adminTabBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      closeTargetEditor();
      adminTab = btn.dataset.tab;
      adminTabBtns.forEach((b) => b.classList.toggle('active', b === btn));
      renderAdminTab();
    });
  });

  async function loadAdminDate(date) {
    adminSummaryEl.innerHTML = '<div class="admin-loading"><div class="admin-spinner"></div></div>';
    const remote = await fetchDateValues(date);
    lastValuesMap = { ...(remote || {}) };
    Object.values(pendingValues).filter(entry => entry.date === date).forEach(entry => { lastValuesMap[entry.itemId] = entry.value; });
    if (date === state.date) {
      Object.entries(state.values).forEach(([id, value]) => { if (!(id in lastValuesMap)) lastValuesMap[id] = value; });
    }
    renderAdminTab();
    if (Object.values(pendingValues).some(entry => entry.date === date)) {
      const notice = document.createElement('div');
      notice.className = 'required-message';
      notice.setAttribute('role', 'status');
      notice.textContent = '서버 저장 대기 중인 입력이 있습니다. 연결되면 자동으로 재시도합니다.';
      adminSummaryEl.prepend(notice);
    }
  }

  async function enterAdminView() {
    closeTargetEditor();
    sheetEl.style.display = 'none';
    bottomNav.style.display = 'none';
    adminView.hidden = false;

    adminTab = 'reorder';
    adminTabBtns.forEach((b) => b.classList.toggle('active', b.dataset.tab === 'reorder'));

    adminDateSelect.innerHTML = `<option value="${state.date}">${state.date}</option>`;
    adminDateSelect.value = state.date;
    loadAdminDate(state.date);

    const dates = await fetchDateList();
    if (dates.length) {
      adminDateSelect.innerHTML = dates
        .map((d) => `<option value="${d}">${d}</option>`)
        .join('');
      adminDateSelect.value = state.date;
    }
  }
  function exitAdminView() {
    syncTodayFromServer();
    adminView.hidden = true;
    sheetEl.style.display = '';
    bottomNav.style.display = '';
  }

  adminDateSelect.addEventListener('change', () => {
    loadAdminDate(adminDateSelect.value);
  });

  let shakeRevertTimer = null;
  function tryAdminLogin() {
    if (adminPassInput.value === ADMIN_PIN) {
      closeAdminLogin();
      enterAdminView();
    } else {
      adminPassInput.value = '';
      clearTimeout(shakeRevertTimer);
      adminPassInput.classList.remove('shake');
      void adminPassInput.offsetWidth;
      adminPassInput.classList.add('shake');
      adminPassInput.focus();
      shakeRevertTimer = setTimeout(() => {
        adminPassInput.classList.remove('shake');
      }, 900);
    }
  }

  eyebrowBtn.addEventListener('click', openAdminLogin);
  adminPassInput.addEventListener('input', () => {
    adminPassInput.classList.remove('shake');
    if (adminPassInput.value.length >= ADMIN_PIN.length) tryAdminLogin();
  });
  adminKeypad.addEventListener('pointerdown', e => e.preventDefault());
  function enterAdminKey(key) {
    if (key === 'submit') { tryAdminLogin(); return; }
    if (key === 'clear') adminPassInput.value = '';
    else if (key === 'backspace') adminPassInput.value = adminPassInput.value.slice(0, -1);
    else adminPassInput.value = (adminPassInput.value + key).slice(0, ADMIN_PIN.length);
    adminPassInput.dispatchEvent(new Event('input', { bubbles: true }));
  }
  adminKeypad.addEventListener('click', e => {
    const key = e.target.closest('[data-admin-key]')?.dataset.adminKey;
    if (key) enterAdminKey(key);
  });
  adminPassInput.addEventListener('keydown', (e) => {
    if (/^[0-9]$/.test(e.key) || e.key === 'Backspace') {
      e.preventDefault();
      enterAdminKey(e.key === 'Backspace' ? 'backspace' : e.key);
    }
    if (e.key === 'Enter') tryAdminLogin();
    if (e.key === 'Escape') closeAdminLogin();
  });
  document.addEventListener('click', (e) => {
    if (adminInlineLogin.hidden) return;
    if (e.target === eyebrowBtn || adminInlineLogin.contains(e.target) || adminKeypad.contains(e.target)) return;
    closeAdminLogin();
  });
  adminBackBtn.addEventListener('click', exitAdminView);

  document.addEventListener('dblclick', event => event.preventDefault(), { passive: false });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
